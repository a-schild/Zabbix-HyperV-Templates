            - uuid: 523bf5d69931459984a6dd82d699ffa5
              name: 'Disk {#DISK.ID} parent VHD'
              type: DEPENDENT
              key: 'hyperv.vm.disk.parent[{#DISK.ID}]'
              delay: '0'
              value_type: CHAR
              trends: '0'
              description: |
                Path of the VHD this disk is a differencing child of. Empty for an ordinary disk.
                Every layer in a differencing chain is read through on the way to the data,
                and a checkpoint adds one. This is one level deep: it answers whether the
                disk reads through something else, without a Get-VHD call per chain level.
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var data = JSON.parse(value);
                      var diskId = "{#DISK.ID}";
                      var diskIdMacro = "{"+"#"+"DISK.ID}";
                      var fieldMacro= "{"+"#DISK.PARENT.PATH}";

                      if (!data.disks || data.disks.length === 0) {
                        throw "ZBX_UNSUPPORTED: No disks array found";
                      }

                      for (var i = 0; i < data.disks.length; i++) {
                        var disk = data.disks[i];
                        if (disk[diskIdMacro] === diskId) {
                          var fieldValue = disk[fieldMacro];
                          // An empty answer is legitimate here: a disk with no parent is
                          // not a differencing disk, and unset QoS reads 0. Returning it
                          // keeps the item supported instead of failing every poll.
                          if (fieldValue === undefined || fieldValue === null) {
                            return "";
                          }
                          return fieldValue;
                        }
                      }

                      var foundIds = [];
                      for (var i = 0; i < data.disks.length; i++) {
                        foundIds.push(data.disks[i][diskIdMacro]);
                      }
                      throw "ZBX_UNSUPPORTED: Disk ID '" + diskId + "' not found. Found: " + foundIds.join(", ");
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: 'hyperv.discovery.vmdetails[{$VM.ID}]'
