zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 0b4d87047ee14edb98a87b309ee5a803
      name: 'HyperV VM'
    - uuid: 7df96b18c230490a9a0a9e2307226338
      name: Templates
    - uuid: aea23489ce3a49b6806ebb28e0cda430
      name: Windows
  templates:
    - uuid: 553c9735a18645849c38ebda859ace9c
      template: 'Template Windows Hyper-V VM Guest 2'
      name: 'Template Windows Hyper-V VM Guest 2'
      vendor:
        name: 'https://github.com/a-schild/Zabbix-HyperV-Templates'
        version: '2.0.6'
      description: 'Child template, to create new Hyper-V VM monitoring from the "Template Windows HyperV Host 2" template. See https://github.com/a-schild/Zabbix-HyperV-Templates'
      groups:
        - name: 'HyperV VM'
        - name: Templates
        - name: Windows
      items:
        - uuid: 77b70fa1ac3b41259978c203f4ac34f0
          name: 'Hyper-V VM master data'
          key: 'hyperv.discovery.vmdetails[{$VM.ID}]'
          delay: '{$VM.DETAILS.INTERVAL}'
          value_type: TEXT
          trends: '0'
          description: |
            Fetch details of VM {$VM.ID}
            Used for LLD
            Contains VM details as well as disks and nic informations
            
            Needs to be Zabbix agent in passive mode, since the request is sent to the Hyper-V server
          timeout: 30s
        - uuid: 9622b2ac2b1f4f8b8887129057c8a04b
          name: 'Checkpoints: count'
          type: DEPENDENT
          key: hyperv.vm.checkpoint.count
          delay: '0'
          value_type: UNSIGNED
          description: |
            Number of checkpoints (snapshots) currently present for this VM, including
            the recovery points Hyper-V Replica maintains on a replica VM.
            The triggers watch hyperv.vm.checkpoint.user.count instead.
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.vm_info["{#VM.CHECKPOINT.COUNT}"]'
          master_item:
            key: 'hyperv.discovery.vmdetails[{$VM.ID}]'
          tags:
            - tag: component
              value: checkpoints
        - uuid: 382a5623652c42c0a788083d340776f8
          name: 'Checkpoints: type'
          type: DEPENDENT
          key: hyperv.vm.checkpoint.type
          delay: '0'
          value_type: CHAR
          trends: '0'
          description: 'Checkpoint type configured for this VM (Standard or Production).'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.vm_info["{#VM.CHECKPOINT.TYPE}"]'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: 'hyperv.discovery.vmdetails[{$VM.ID}]'
          tags:
            - tag: component
              value: checkpoints
        - uuid: 4b0a14b462284d2c8ac983c68628aa0c
          name: 'Checkpoints: oldest name'
          type: DEPENDENT
          key: hyperv.vm.checkpoint.oldest.name
          delay: '0'
          value_type: CHAR
          trends: '0'
          description: 'Name of the oldest checkpoint. Empty when the VM has no checkpoints.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.vm_info["{#VM.CHECKPOINT.OLDEST.NAME}"]'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: 'hyperv.discovery.vmdetails[{$VM.ID}]'
          tags:
            - tag: component
              value: checkpoints
        - uuid: bc05a0f7c62744ec97ab9a0462406eec
          name: 'Checkpoints: oldest created'
          type: DEPENDENT
          key: hyperv.vm.checkpoint.oldest.created
          delay: '0'
          value_type: CHAR
          trends: '0'
          description: 'Creation time of the oldest checkpoint, as local time on the Hyper-V host.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.vm_info["{#VM.CHECKPOINT.OLDEST.CREATED}"]'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: 'hyperv.discovery.vmdetails[{$VM.ID}]'
          tags:
            - tag: component
              value: checkpoints
        - uuid: dac4cb96a287416faa8571ecf65ad757
          name: 'Checkpoints: oldest age'
          type: DEPENDENT
          key: hyperv.vm.checkpoint.oldest.age
          delay: '0'
          value_type: UNSIGNED
          units: 's'
          description: |
            Age of the oldest checkpoint. Computed on the Hyper-V host, so no timezone
            correction is needed here. 0 when the VM has no checkpoints.
            On a replica VM this is the oldest Hyper-V Replica recovery point, which is
            expected to be as old as the configured coverage. The age trigger therefore
            watches hyperv.vm.checkpoint.user.oldest.age instead.
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.vm_info["{#VM.CHECKPOINT.OLDEST.AGE}"]'
          master_item:
            key: 'hyperv.discovery.vmdetails[{$VM.ID}]'
          tags:
            - tag: component
              value: checkpoints
        - uuid: 5bfbfc7c457c46d0a764cf9c554ae543
          name: 'Checkpoints: newest name'
          type: DEPENDENT
          key: hyperv.vm.checkpoint.newest.name
          delay: '0'
          value_type: CHAR
          trends: '0'
          description: 'Name of the most recent checkpoint. Empty when the VM has no checkpoints.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.vm_info["{#VM.CHECKPOINT.NEWEST.NAME}"]'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: 'hyperv.discovery.vmdetails[{$VM.ID}]'
          tags:
            - tag: component
              value: checkpoints
        - uuid: 5d25508402f44bc7aca9993b4bcd8a93
          name: 'Checkpoints: newest created'
          type: DEPENDENT
          key: hyperv.vm.checkpoint.newest.created
          delay: '0'
          value_type: CHAR
          trends: '0'
          description: 'Creation time of the most recent checkpoint, as local time on the Hyper-V host.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.vm_info["{#VM.CHECKPOINT.NEWEST.CREATED}"]'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: 'hyperv.discovery.vmdetails[{$VM.ID}]'
          tags:
            - tag: component
              value: checkpoints
        - uuid: e9e62a7026ea4c03ba2b0dcfc352efc4
          name: 'Checkpoints: newest age'
          type: DEPENDENT
          key: hyperv.vm.checkpoint.newest.age
          delay: '0'
          value_type: UNSIGNED
          units: 's'
          description: 'Age of the most recent checkpoint. 0 when the VM has no checkpoints.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.vm_info["{#VM.CHECKPOINT.NEWEST.AGE}"]'
          master_item:
            key: 'hyperv.discovery.vmdetails[{$VM.ID}]'
          tags:
            - tag: component
              value: checkpoints
        - uuid: 25881f04954d4e389d83d5d052d6e9b0
          name: 'Checkpoints: details'
          type: DEPENDENT
          key: hyperv.vm.checkpoint.info
          delay: '0'
          value_type: TEXT
          trends: '0'
          description: |
            Raw json list of all checkpoints: name, creation time, age, parent, snapshot
            type and IsReplica, which is true for the recovery points Hyper-V Replica
            creates and removes by itself.
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.vm_info["{#VM.CHECKPOINT.INFO}"]'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: 'hyperv.discovery.vmdetails[{$VM.ID}]'
          tags:
            - tag: component
              value: checkpoints
        - uuid: 2e15f392bd3c4b10b41819ce34e07784
          name: 'Checkpoints: user count'
          type: DEPENDENT
          key: hyperv.vm.checkpoint.user.count
          delay: '0'
          value_type: UNSIGNED
          description: |
            Number of checkpoints excluding the recovery points Hyper-V Replica manages
            on its own (snapshot types Replica, AppConsistentReplica, SyncedReplica,
            Planned, Recovery and Missing).
            A replica VM configured for additional hourly recovery points permanently
            carries one checkpoint per covered hour; those are normal operation and
            would otherwise keep the checkpoint triggers firing.
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.vm_info["{#VM.CHECKPOINT.USER.COUNT}"]'
          master_item:
            key: 'hyperv.discovery.vmdetails[{$VM.ID}]'
          tags:
            - tag: component
              value: checkpoints
          triggers:
            - uuid: aba804d6efa148fab782cf4dae64656f
              expression: 'last(/Template Windows Hyper-V VM Guest 2/hyperv.vm.checkpoint.user.count)>{$VM.CHECKPOINT.COUNT.MAX}'
              name: 'Hyper-V: too many checkpoints on {HOST.NAME}'
              priority: WARNING
              description: |
                Each checkpoint adds another avhdx to the differencing chain, which costs
                read performance and disk space. Adjust with {$VM.CHECKPOINT.COUNT.MAX}.
                Hyper-V Replica recovery points are not counted here.
        - uuid: 72120337a47a4a4b9e37728ba6bb9fb4
          name: 'Checkpoints: user oldest age'
          type: DEPENDENT
          key: hyperv.vm.checkpoint.user.oldest.age
          delay: '0'
          value_type: UNSIGNED
          units: 's'
          description: |
            Age of the oldest checkpoint that is not a Hyper-V Replica recovery point.
            Computed on the Hyper-V host, so no timezone correction is needed here.
            0 when the VM has no such checkpoint.
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.vm_info["{#VM.CHECKPOINT.USER.OLDEST.AGE}"]'
          master_item:
            key: 'hyperv.discovery.vmdetails[{$VM.ID}]'
          tags:
            - tag: component
              value: checkpoints
          triggers:
            - uuid: 84b43c71750e425cb94d85d297dad707
              expression: 'last(/Template Windows Hyper-V VM Guest 2/hyperv.vm.checkpoint.user.count)>0 and last(/Template Windows Hyper-V VM Guest 2/hyperv.vm.checkpoint.user.oldest.age)>{$VM.CHECKPOINT.AGE.MAX}'
              name: 'Hyper-V: checkpoint older than {$VM.CHECKPOINT.AGE.MAX} on {HOST.NAME}'
              priority: WARNING
              description: |
                A checkpoint has been left behind. Its avhdx keeps growing for as long as
                it exists and merging it back gets slower the longer it is kept.
                The count check guards against firing on VMs that have no checkpoints.
                Hyper-V Replica recovery points are ignored, they are removed by Hyper-V
                itself once they fall outside the configured coverage.
        - uuid: 9140a39673a040e09afcd969d01ce2a1
          name: 'Checkpoints: user oldest name'
          type: DEPENDENT
          key: hyperv.vm.checkpoint.user.oldest.name
          delay: '0'
          value_type: CHAR
          trends: '0'
          description: |
            Name of the oldest checkpoint that is not a Hyper-V Replica recovery point.
            Empty when the VM has no such checkpoint. This is the one the age trigger
            refers to.
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.vm_info["{#VM.CHECKPOINT.USER.OLDEST.NAME}"]'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: 'hyperv.discovery.vmdetails[{$VM.ID}]'
          tags:
            - tag: component
              value: checkpoints
        - uuid: 18b1e87d5601462e853e3406b441925d
          name: 'Checkpoints: replica recovery points'
          type: DEPENDENT
          key: hyperv.vm.checkpoint.replica.count
          delay: '0'
          value_type: UNSIGNED
          description: |
            Number of checkpoints that belong to Hyper-V Replica. On a replica VM this
            follows the configured recovery point coverage; on a primary VM it is
            normally 0 except while a replication cycle is running.
            Not alerted on, Hyper-V creates and removes these itself.
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.vm_info["{#VM.CHECKPOINT.REPLICA.COUNT}"]'
          master_item:
            key: 'hyperv.discovery.vmdetails[{$VM.ID}]'
          tags:
            - tag: component
              value: checkpoints
        - uuid: 0f3737005fc54b0ba6db29f954a75f13
          name: 'Replication: enabled'
          type: DEPENDENT
          key: hyperv.vm.replication.enabled
          delay: '0'
          value_type: CHAR
          trends: '0'
          description: |
            True when Hyper-V Replica is configured for this VM, False otherwise.
            All other replication items carry neutral values when this is False, so a
            VM that is not replicated does not turn them unsupported.
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.vm_info["{#VM.REPLICATION.ENABLED}"]'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: 'hyperv.discovery.vmdetails[{$VM.ID}]'
          tags:
            - tag: component
              value: replication
        - uuid: 4744210b850547b9a460ad5d61ed7383
          name: 'Replication: state'
          type: DEPENDENT
          key: hyperv.vm.replication.state
          delay: '0'
          value_type: CHAR
          trends: '0'
          description: |
            Replication state: Replicating, Suspended, Resynchronizing,
            WaitingForInitialReplication, FailedOver, ... NotEnabled when the VM is not
            replicated.
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.vm_info["{#VM.REPLICATION.STATE}"]'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: 'hyperv.discovery.vmdetails[{$VM.ID}]'
          tags:
            - tag: component
              value: replication
        - uuid: 6bce0d566f2f4c99849713e90fefb692
          name: 'Replication: mode'
          type: DEPENDENT
          key: hyperv.vm.replication.mode
          delay: '0'
          value_type: CHAR
          trends: '0'
          description: |
            Which side of the relationship this VM is: Primary, Replica or TestReplica.
            None when the VM is not replicated.
            A Replica VM permanently holds the configured recovery points, which is why
            the checkpoint triggers ignore them.
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.vm_info["{#VM.REPLICATION.MODE}"]'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: 'hyperv.discovery.vmdetails[{$VM.ID}]'
          tags:
            - tag: component
              value: replication
        - uuid: a7a4900ef0814e9eaf9d204d577b22f9
          name: 'Replication: health'
          type: DEPENDENT
          key: hyperv.vm.replication.health
          delay: '0'
          value_type: CHAR
          trends: '0'
          description: |
            Hyper-V's own verdict on the replication: Normal, Warning or Critical.
            NotApplicable when the VM is not replicated.
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.vm_info["{#VM.REPLICATION.HEALTH}"]'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: 'hyperv.discovery.vmdetails[{$VM.ID}]'
          tags:
            - tag: component
              value: replication
          triggers:
            - uuid: 2939242caab64a7c82dcca276d325c38
              expression: 'last(/Template Windows Hyper-V VM Guest 2/hyperv.vm.replication.health)="Critical"'
              name: 'Hyper-V: replication health critical on {HOST.NAME}'
              priority: HIGH
              description: |
                Hyper-V reports the replication of this VM as Critical: replication has
                stopped or is failing repeatedly. The replica is stale from now on.
            - uuid: 6a0582cee3cd40ff96f07422a355b0cc
              expression: 'last(/Template Windows Hyper-V VM Guest 2/hyperv.vm.replication.health)="Warning"'
              name: 'Hyper-V: replication health warning on {HOST.NAME}'
              priority: WARNING
              description: |
                Hyper-V reports the replication of this VM as Warning: cycles are being
                missed or a resynchronization is pending.
        - uuid: bb03c2a3cb5844708c09d8680e66dc91
          name: 'Replication: frequency'
          type: DEPENDENT
          key: hyperv.vm.replication.frequency
          delay: '0'
          value_type: UNSIGNED
          units: 's'
          description: |
            Configured replication interval, 30, 300 or 900 seconds.
            0 when the VM is not replicated.
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.vm_info["{#VM.REPLICATION.FREQUENCY}"]'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: 'hyperv.discovery.vmdetails[{$VM.ID}]'
          tags:
            - tag: component
              value: replication
        - uuid: a1c9b0e033884a458d11b75439e6002d
          name: 'Replication: last sync'
          type: DEPENDENT
          key: hyperv.vm.replication.last.sync
          delay: '0'
          value_type: CHAR
          trends: '0'
          description: |
            Time of the last completed replication, as local time on the Hyper-V host.
            Empty when the VM is not replicated or has not replicated yet.
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.vm_info["{#VM.REPLICATION.LAST.TIME}"]'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: 'hyperv.discovery.vmdetails[{$VM.ID}]'
          tags:
            - tag: component
              value: replication
        - uuid: f059a29509d34bca8af7340cfb82d288
          name: 'Replication: last sync age'
          type: DEPENDENT
          key: hyperv.vm.replication.last.sync.age
          delay: '0'
          value_type: UNSIGNED
          units: 's'
          description: |
            Seconds since the last completed replication. Computed on the Hyper-V host,
            so no timezone correction is needed here.
            0 when the VM is not replicated or has never replicated, so the accompanying
            trigger cannot fire on those.
            Note this is only as fresh as the master item, so it can lag reality by up to
            {$VM.DETAILS.INTERVAL}; keep {$VM.REPLICATION.LAG.MAX} comfortably above that.
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.vm_info["{#VM.REPLICATION.LAST.AGE}"]'
          master_item:
            key: 'hyperv.discovery.vmdetails[{$VM.ID}]'
          tags:
            - tag: component
              value: replication
          triggers:
            - uuid: 8f0151bd8ff34348b9ffb4459a0abbee
              expression: 'last(/Template Windows Hyper-V VM Guest 2/hyperv.vm.replication.enabled)="True" and last(/Template Windows Hyper-V VM Guest 2/hyperv.vm.replication.last.sync.age)>{$VM.REPLICATION.LAG.MAX}'
              name: 'Hyper-V: replication of {HOST.NAME} has not run for {$VM.REPLICATION.LAG.MAX}'
              priority: WARNING
              description: |
                The replica is falling behind. Hyper-V's own health field can still read
                Normal while cycles are merely slow, so this watches the clock directly.
                The enabled check keeps it off VMs that are not replicated.
        - uuid: ee3b0f18de304e0cb285daff9591df22
          name: 'Replication: primary server'
          type: DEPENDENT
          key: hyperv.vm.replication.primary.server
          delay: '0'
          value_type: CHAR
          trends: '0'
          description: 'Hyper-V host holding the primary VM. Empty when the VM is not replicated.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.vm_info["{#VM.REPLICATION.PRIMARY.SERVER}"]'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: 'hyperv.discovery.vmdetails[{$VM.ID}]'
          tags:
            - tag: component
              value: replication
        - uuid: e3a53bfb9a8449ec945ed46732c1fe99
          name: 'Replication: replica server'
          type: DEPENDENT
          key: hyperv.vm.replication.replica.server
          delay: '0'
          value_type: CHAR
          trends: '0'
          description: 'Hyper-V host receiving the replica. Empty when the VM is not replicated.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.vm_info["{#VM.REPLICATION.REPLICA.SERVER}"]'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: 'hyperv.discovery.vmdetails[{$VM.ID}]'
          tags:
            - tag: component
              value: replication
        - uuid: 0d887538ca8f4642a4699936abf317cc
          name: 'Replication: recovery points configured'
          type: DEPENDENT
          key: hyperv.vm.replication.recovery.history
          delay: '0'
          value_type: UNSIGNED
          description: |
            How many recovery points Hyper-V is told to keep for this VM, straight from
            the replication settings ("additional hourly recovery points, coverage in
            hours" in the VM settings dialog).
            0 means only the latest recovery point is kept, which is also the value for
            a VM that is not replicated.
            This is the number the replica side's checkpoint count is expected to
            follow, see 'Checkpoints: replica recovery points'.
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.vm_info["{#VM.REPLICATION.RECOVERY.HISTORY}"]'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: 'hyperv.discovery.vmdetails[{$VM.ID}]'
          tags:
            - tag: component
              value: replication
          triggers:
            - uuid: 6f8eeeb8f8ea4a9696e993dd55f072eb
              expression: 'last(/Template Windows Hyper-V VM Guest 2/hyperv.vm.replication.mode)="Replica" and last(/Template Windows Hyper-V VM Guest 2/hyperv.vm.replication.recovery.history)>0 and last(/Template Windows Hyper-V VM Guest 2/hyperv.vm.checkpoint.replica.count)>last(/Template Windows Hyper-V VM Guest 2/hyperv.vm.replication.recovery.history)+1'
              name: 'Hyper-V: more replica recovery points than configured on {HOST.NAME}'
              priority: WARNING
              description: |
                A replica VM holds more recovery points than its replication settings ask
                for, so Hyper-V is not merging the old ones away. Every one of them is
                another avhdx in the chain, and the volume fills up from there.
                Normal checkpoint alerting deliberately ignores replica recovery points,
                which is exactly why this check exists.
                The comparison allows one point of slack: the newest point can exist
                alongside a full history for a moment during a replication cycle.
                Only evaluated on the replica side, the primary does not keep a history.
        - uuid: 9ce909fa85ce48febe1f4e4b20f7dac6
          name: 'Replication: VSS snapshot frequency'
          type: DEPENDENT
          key: hyperv.vm.replication.vss.frequency
          delay: '0'
          value_type: UNSIGNED
          description: |
            Interval in HOURS between application consistent (VSS) recovery points.
            0 when incremental VSS copies are switched off, which is the default, and
            for a VM that is not replicated.
            Only meaningful with recovery points configured; the guest needs current
            integration components for it to work at all.
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.vm_info["{#VM.REPLICATION.VSS.FREQUENCY}"]'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: 'hyperv.discovery.vmdetails[{$VM.ID}]'
          tags:
            - tag: component
              value: replication
        - uuid: 49372bca2a654ebf85bdad4f8b841ac5
          name: 'Replication: pending size'
          type: DEPENDENT
          key: hyperv.vm.replication.pending.size
          delay: '0'
          value_type: UNSIGNED
          units: B
          description: |
            Bytes written by the VM but not yet replicated. A healthy VM sits at
            practically nothing between cycles (4096 is the idle floor Hyper-V reports);
            a figure that climbs cycle after cycle means the link cannot keep up with
            the write rate.
            0 when the VM is not replicated.
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.vm_info["{#VM.REPLICATION.PENDING.SIZE}"]'
          master_item:
            key: 'hyperv.discovery.vmdetails[{$VM.ID}]'
          tags:
            - tag: component
              value: replication
        - uuid: 772bc531d1db4c51872e36d7e3c6595f
          name: 'Replication: average size'
          type: DEPENDENT
          key: hyperv.vm.replication.avg.size
          delay: '0'
          value_type: UNSIGNED
          units: B
          description: |
            Average bytes transferred per replication cycle over the current measuring
            window, see 'Replication: statistics window'.
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.vm_info["{#VM.REPLICATION.AVG.SIZE}"]'
          master_item:
            key: 'hyperv.discovery.vmdetails[{$VM.ID}]'
          tags:
            - tag: component
              value: replication
        - uuid: 7f19773aad3b41fca706ed428a49c4a1
          name: 'Replication: maximum size'
          type: DEPENDENT
          key: hyperv.vm.replication.max.size
          delay: '0'
          value_type: UNSIGNED
          units: B
          description: |
            Largest single replication cycle in the current measuring window. Usually
            far above the average: it is the catch up cycle after a resynchronization
            or a busy period.
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.vm_info["{#VM.REPLICATION.MAX.SIZE}"]'
          master_item:
            key: 'hyperv.discovery.vmdetails[{$VM.ID}]'
          tags:
            - tag: component
              value: replication
        - uuid: baaaaf9afb9f466aa0ed6485c4379cd0
          name: 'Replication: average latency'
          type: DEPENDENT
          key: hyperv.vm.replication.avg.latency
          delay: '0'
          value_type: UNSIGNED
          units: 's'
          description: |
            Average time a replication cycle took in the current measuring window.
            Compare against 'Replication: frequency': a latency approaching the
            frequency means cycles barely finish before the next one is due.
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.vm_info["{#VM.REPLICATION.AVG.LATENCY}"]'
          master_item:
            key: 'hyperv.discovery.vmdetails[{$VM.ID}]'
          tags:
            - tag: component
              value: replication
        - uuid: 5ece844497dc40ffb8f2d44530c1a79a
          name: 'Replication: maximum latency'
          type: DEPENDENT
          key: hyperv.vm.replication.max.latency
          delay: '0'
          value_type: UNSIGNED
          units: 's'
          description: |
            Slowest replication cycle in the current measuring window. Expect this to be
            several times the average, it captures the worst catch up cycle.
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.vm_info["{#VM.REPLICATION.MAX.LATENCY}"]'
          master_item:
            key: 'hyperv.discovery.vmdetails[{$VM.ID}]'
          tags:
            - tag: component
              value: replication
        - uuid: c293f97c1b68446f9720d76e6632d247
          name: 'Replication: successful cycles'
          type: DEPENDENT
          key: hyperv.vm.replication.success.count
          delay: '0'
          value_type: UNSIGNED
          description: |
            Replication cycles completed in the current measuring window.
            This is NOT a lifetime counter: Hyper-V resets it together with the window,
            so it climbs and drops back. Do not put a change() based trigger on it.
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.vm_info["{#VM.REPLICATION.SUCCESS.COUNT}"]'
          master_item:
            key: 'hyperv.discovery.vmdetails[{$VM.ID}]'
          tags:
            - tag: component
              value: replication
        - uuid: 2d3b3eba42ce45feab290d1c4d5bc6a1
          name: 'Replication: missed cycles'
          type: DEPENDENT
          key: hyperv.vm.replication.missed.count
          delay: '0'
          value_type: UNSIGNED
          description: |
            Replication cycles that did not happen in the current measuring window.
            The odd missed cycle is normal on a busy host; a number that keeps growing
            is a link or storage problem. Resets with the window, like the successful
            cycle count.
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.vm_info["{#VM.REPLICATION.MISSED.COUNT}"]'
          master_item:
            key: 'hyperv.discovery.vmdetails[{$VM.ID}]'
          tags:
            - tag: component
              value: replication
          triggers:
            - uuid: 8e4bbca10f7649b6a6c403baa1c8976a
              expression: 'last(/Template Windows Hyper-V VM Guest 2/hyperv.vm.replication.missed.count)>{$VM.REPLICATION.MISSED.MAX}'
              name: 'Hyper-V: replication cycles missed on {HOST.NAME}'
              priority: WARNING
              description: |
                More replication cycles were missed in the current measuring window than
                {$VM.REPLICATION.MISSED.MAX} allows. Hyper-V's own health field often
                still reads Normal at this point.
                Counts reset when Hyper-V starts a new window, so this clears by itself
                once the trouble stops.
        - uuid: 1ee12a1602014887bcd14d3961e5efa6
          name: 'Replication: errors'
          type: DEPENDENT
          key: hyperv.vm.replication.error.count
          delay: '0'
          value_type: UNSIGNED
          description: |
            Replication errors Hyper-V recorded in the current measuring window.
            A couple of these on an otherwise healthy VM is common, which is why the
            trigger threshold is a macro rather than "greater than zero".
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.vm_info["{#VM.REPLICATION.ERROR.COUNT}"]'
          master_item:
            key: 'hyperv.discovery.vmdetails[{$VM.ID}]'
          tags:
            - tag: component
              value: replication
          triggers:
            - uuid: cc73d5213a17436b9a61166316a5760b
              expression: 'last(/Template Windows Hyper-V VM Guest 2/hyperv.vm.replication.error.count)>{$VM.REPLICATION.ERRORS.MAX}'
              name: 'Hyper-V: replication errors on {HOST.NAME}'
              priority: WARNING
              description: |
                Hyper-V recorded more replication errors than {$VM.REPLICATION.ERRORS.MAX}
                in the current measuring window. Check the Hyper-V-VMMS event log on both
                the primary and the replica server.
        - uuid: 58e1bbd80bcc4d3ba117f16b8c6e0327
          name: 'Replication: statistics window'
          type: DEPENDENT
          key: hyperv.vm.replication.stats.window
          delay: '0'
          value_type: UNSIGNED
          units: 's'
          description: |
            How long the current measuring window has been running, which is the period
            the cycle counts, sizes and latencies above refer to.
            Hyper-V starts a new window by itself (and Reset-VMReplicationStatistics
            forces one), so a sudden drop here explains a sudden drop in the counts.
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.vm_info["{#VM.REPLICATION.STATS.WINDOW}"]'
          master_item:
            key: 'hyperv.discovery.vmdetails[{$VM.ID}]'
          tags:
            - tag: component
              value: replication
        - uuid: ac3efacd3d474ffea4bb3de1bff98493
          name: 'CPU usage'
          type: DEPENDENT
          key: hyperv.vm.cpu.usage
          delay: '0'
          value_type: UNSIGNED
          units: '%'
          description: |
            Share of the Hyper-V host's CPU this VM was using AT THE MOMENT THE MASTER
            ITEM RAN. It is a spot sample taken once per {$VM.DETAILS.INTERVAL}, not an
            average over the interval, so it will happily read 0 for a VM that spikes
            between polls.
            Good enough to answer "what is it doing right now"; do NOT build CPU
            alerting on it. Per virtual processor performance counters are the right
            source for that.
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.vm_info["{#VM.CPU.USAGE}"]'
          master_item:
            key: 'hyperv.discovery.vmdetails[{$VM.ID}]'
          tags:
            - tag: component
              value: cpu
        - uuid: 5b2972716e144e52b39e8a48683fd8cb
          name: 'Memory assigned'
          type: DEPENDENT
          key: hyperv.vm.memory.assigned
          delay: '0'
          value_type: UNSIGNED
          units: B
          description: |
            Memory the host currently has assigned to this VM. With dynamic memory off
            this equals the startup memory; with it on it moves between the configured
            minimum and maximum. 0 when the VM is not running.
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.vm_info["{#VM.MEMORY.ASSIGNED}"]'
          master_item:
            key: 'hyperv.discovery.vmdetails[{$VM.ID}]'
          tags:
            - tag: component
              value: memory
        - uuid: d366df14b08343aaae7c03c863efbc4e
          name: 'Memory demand'
          type: DEPENDENT
          key: hyperv.vm.memory.demand
          delay: '0'
          value_type: UNSIGNED
          units: B
          description: |
            Memory the guest actually wants. Hyper-V reports this even when dynamic
            memory is switched off, so it works for every VM: it is the honest answer
            to "is this VM over or under provisioned". 0 when the VM is not running.
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.vm_info["{#VM.MEMORY.DEMAND}"]'
          master_item:
            key: 'hyperv.discovery.vmdetails[{$VM.ID}]'
          tags:
            - tag: component
              value: memory
        - uuid: a21798d7a1ff40e696f11d90c8b26b02
          name: 'Memory pressure'
          type: DEPENDENT
          key: hyperv.vm.memory.pressure
          delay: '0'
          value_type: FLOAT
          units: '%'
          description: |
            Memory demand as a percentage of memory assigned, computed on the Hyper-V
            host. Above 100 would mean the guest wants more than it has; a VM sitting
            near the limit with dynamic memory on cannot grow any further.
            0 when the VM is not running.
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.vm_info["{#VM.MEMORY.PRESSURE}"]'
          master_item:
            key: 'hyperv.discovery.vmdetails[{$VM.ID}]'
          tags:
            - tag: component
              value: memory
          triggers:
            - uuid: 93baf568a885451f87581fc592c8db1c
              expression: 'last(/Template Windows Hyper-V VM Guest 2/hyperv.vm.memory.pressure)>{$VM.MEMORY.PRESSURE.MAX}'
              name: 'Hyper-V: memory pressure on {HOST.NAME}'
              priority: WARNING
              description: |
                The guest is demanding close to, or more than, the memory it has been
                assigned. With dynamic memory enabled Hyper-V will already have grown
                the VM as far as its maximum allows.
        - uuid: cb199d912b0a450dbaebfebcd6e70606
          name: 'Heartbeat'
          type: DEPENDENT
          key: hyperv.vm.heartbeat
          delay: '0'
          value_type: CHAR
          trends: '0'
          description: |
            Heartbeat integration service state: OkApplicationsHealthy,
            OkApplicationsUnknown, OkApplicationsCritical, NoContact,
            LostCommunication, Paused, Error or Disabled. Empty for a stopped VM.
            These VMs have no Zabbix agent of their own, so this is the only signal
            that the guest operating system is alive at all.
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.vm_info["{#VM.HEARTBEAT}"]'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: 'hyperv.discovery.vmdetails[{$VM.ID}]'
          tags:
            - tag: component
              value: state
          triggers:
            - uuid: 4ed6504fe4e44ba6a5bffa747f9ac483
              expression: 'last(/Template Windows Hyper-V VM Guest 2/hyperv.vm.state)="Running" and (last(/Template Windows Hyper-V VM Guest 2/hyperv.vm.heartbeat)="NoContact" or last(/Template Windows Hyper-V VM Guest 2/hyperv.vm.heartbeat)="LostCommunication")'
              name: 'Hyper-V: no heartbeat from {HOST.NAME}'
              priority: AVERAGE
              description: |
                The VM is running but the guest is not answering the heartbeat service.
                The operating system has hung, is still booting, or the integration
                services are stopped or missing.
                Only evaluated while the VM is Running, a stopped VM legitimately has
                no heartbeat.
        - uuid: 17bc2489e6834cdcb20e40235c6e5298
          name: 'Operational status'
          type: DEPENDENT
          key: hyperv.vm.operational.status
          delay: '0'
          value_type: CHAR
          trends: '0'
          description: |
            Primary operational status of the VM as an enum value: Ok, Degraded, Error,
            PredictiveFailure, ...
            Unlike 'VM status' this is not localized, so it does not depend on the
            ConvertToEnglish translation table in the script.
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.vm_info["{#VM.OPERATIONAL.STATUS}"]'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: 'hyperv.discovery.vmdetails[{$VM.ID}]'
          tags:
            - tag: component
              value: state
        - uuid: f3ce023e074947268fde710cf4e13f5d
          name: 'Operational status (secondary)'
          type: DEPENDENT
          key: hyperv.vm.operational.status.secondary
          delay: '0'
          value_type: CHAR
          trends: '0'
          description: |
            Secondary operational status, empty on a healthy VM. This is where Hyper-V
            puts the detail behind a problem, for example the reason a VM went
            paused-critical.
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.vm_info["{#VM.OPERATIONAL.STATUS.SECONDARY}"]'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: 'hyperv.discovery.vmdetails[{$VM.ID}]'
          tags:
            - tag: component
              value: state
        - uuid: 43b8bc969f764bce8739c69444d26b13
          name: 'Smart paging file in use'
          type: DEPENDENT
          key: hyperv.vm.smart.paging.in.use
          delay: '0'
          value_type: CHAR
          trends: '0'
          description: |
            True while Hyper-V is paging this VM's memory to disk because it could not
            satisfy the startup memory from RAM. Disk backed memory is orders of
            magnitude slower, and Hyper-V only resorts to it under real pressure.
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.vm_info["{#VM.SMART.PAGING.IN.USE}"]'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: 'hyperv.discovery.vmdetails[{$VM.ID}]'
          tags:
            - tag: component
              value: memory
          triggers:
            - uuid: 62f1f15a8f5847748334f80c0b33aed9
              expression: 'last(/Template Windows Hyper-V VM Guest 2/hyperv.vm.smart.paging.in.use)="True"'
              name: 'Hyper-V: smart paging file in use on {HOST.NAME}'
              priority: WARNING
              description: |
                The Hyper-V host could not give this VM its startup memory from RAM and
                is paging to disk instead. The host is overcommitted.
        - uuid: 8c68557287204b3d9727f130d4337d56
          name: 'Clustered'
          type: DEPENDENT
          key: hyperv.vm.clustered
          delay: '0'
          value_type: CHAR
          trends: '0'
          description: 'True when this VM is a failover cluster resource and can move between nodes.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.vm_info["{#VM.CLUSTERED}"]'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: 'hyperv.discovery.vmdetails[{$VM.ID}]'
          tags:
            - tag: component
              value: config
        - uuid: 65e61585f94f48738e5c3bb362c33d94
          name: 'Resource metering enabled'
          type: DEPENDENT
          key: hyperv.vm.metering.enabled
          delay: '0'
          value_type: CHAR
          trends: '0'
          description: |
            True when Hyper-V resource metering is switched on for this VM
            (Enable-VMResourceMetering). Off by default.
            Nothing in this template needs it yet; it is reported so it is obvious why
            metering derived figures would be empty.
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.vm_info["{#VM.METERING.ENABLED}"]'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: 'hyperv.discovery.vmdetails[{$VM.ID}]'
          tags:
            - tag: component
              value: config
        - uuid: cf6c752d4722449aa9302c6feefc3347
          name: 'Mounted ISO images'
          type: DEPENDENT
          key: hyperv.vm.dvd.iso.count
          delay: '0'
          value_type: UNSIGNED
          description: |
            Number of DVD drives with an image attached. Mounting an iso is a perfectly
            normal thing to do, but leaving it attached blocks live migration and quietly
            pins the VM to its current host, which is usually discovered at the worst
            possible moment.
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.vm_info["{#VM.DVD.ISO.COUNT}"]'
          master_item:
            key: 'hyperv.discovery.vmdetails[{$VM.ID}]'
          tags:
            - tag: component
              value: config
          triggers:
            - uuid: e49d30733bcc42569bab381c7efdeba4
              expression: 'last(/Template Windows Hyper-V VM Guest 2/hyperv.vm.dvd.iso.count)>0'
              name: 'Hyper-V: ISO image left mounted on {HOST.NAME}'
              priority: INFO
              description: |
                An image is attached to this VM's DVD drive. The VM cannot be live
                migrated while that is true.
                INFO severity on purpose: this is routine during an installation and only
                matters when it is forgotten. 'Mounted ISO paths' shows which image.
        - uuid: 63954cbb9db44f07a7364351ef1b29f4
          name: 'Mounted ISO paths'
          type: DEPENDENT
          key: hyperv.vm.dvd.iso.paths
          delay: '0'
          value_type: CHAR
          trends: '0'
          description: |
            Paths of the attached images, separated by "; ". Empty when no image is
            mounted.
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.vm_info["{#VM.DVD.ISO.PATHS}"]'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: 'hyperv.discovery.vmdetails[{$VM.ID}]'
          tags:
            - tag: component
              value: config
        - uuid: 55ea1176074f48aea0a4b884a2156cf1
          name: 'Security: secure boot'
          type: DEPENDENT
          key: hyperv.vm.security.secure.boot
          delay: '0'
          value_type: CHAR
          trends: '0'
          description: |
            Secure Boot state: On, Off, or NotSupported for a Generation 1 VM, which has
            no UEFI firmware at all - a different statement from Secure Boot being
            switched off, hence the third value.
            Read together with 'Security: secure boot template': Secure Boot On with the
            wrong template is why a Linux guest fails to boot after it is enabled.
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.vm_info["{#VM.SECURITY.SECURE.BOOT}"]'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: 'hyperv.discovery.vmdetails[{$VM.ID}]'
          tags:
            - tag: component
              value: security
          triggers:
            - uuid: 9386619253724e6bbf35f2bc4c977bcb
              expression: 'last(/Template Windows Hyper-V VM Guest 2/hyperv.vm.security.secure.boot)="Off"'
              name: 'Hyper-V: secure boot disabled on {HOST.NAME}'
              status: DISABLED
              priority: INFO
              description: |
                A Generation 2 VM is running with Secure Boot switched off.
                SHIPS DISABLED ON PURPOSE: plenty of VMs have it off for good reasons,
                so enable this only where Secure Boot is a policy you actually enforce.
                Generation 1 VMs report NotSupported and can never match.
        - uuid: 840108051ff949caa18581b33ec6c2cf
          name: 'Security: secure boot template'
          type: DEPENDENT
          key: hyperv.vm.security.secure.boot.template
          delay: '0'
          value_type: CHAR
          trends: '0'
          description: |
            Certificate authority Secure Boot validates against: MicrosoftWindows for
            Windows guests, MicrosoftUEFICertificateAuthority for most Linux guests,
            OpenSourceShieldedVM for shielded Linux.
            Empty on a Generation 1 VM.
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.vm_info["{#VM.SECURITY.SECURE.BOOT.TEMPLATE}"]'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: 'hyperv.discovery.vmdetails[{$VM.ID}]'
          tags:
            - tag: component
              value: security
        - uuid: 7789c910e82f4afeae2c1cf285387669
          name: 'Security: virtual TPM'
          type: DEPENDENT
          key: hyperv.vm.security.tpm
          delay: '0'
          value_type: CHAR
          trends: '0'
          description: |
            True when the VM has a virtual TPM. Required by BitLocker and by Windows 11
            guests. Generation 2 VMs only, a Generation 1 VM always reports False.
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.vm_info["{#VM.SECURITY.TPM}"]'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: 'hyperv.discovery.vmdetails[{$VM.ID}]'
          tags:
            - tag: component
              value: security
        - uuid: c1518b245c7140d3b33c761f95bc5cc9
          name: 'Security: shielded'
          type: DEPENDENT
          key: hyperv.vm.security.shielded
          delay: '0'
          value_type: CHAR
          trends: '0'
          description: |
            True when the VM is shielded: its disks are encrypted and the host
            administrator cannot open a console, inspect the memory or attach a debugger.
            Needs a Host Guardian Service, so False on a standalone host.
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.vm_info["{#VM.SECURITY.SHIELDED}"]'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: 'hyperv.discovery.vmdetails[{$VM.ID}]'
          tags:
            - tag: component
              value: security
        - uuid: 9f24315460e34935a2eb3ecb8825f2ba
          name: 'Security: state and migration traffic encrypted'
          type: DEPENDENT
          key: hyperv.vm.security.encrypt.migration
          delay: '0'
          value_type: CHAR
          trends: '0'
          description: |
            True when saved state and live migration traffic are encrypted. Without it a
            live migration moves guest memory over the network in the clear, which is
            worth knowing on a network shared with anything else.
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.vm_info["{#VM.SECURITY.ENCRYPT.MIGRATION}"]'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: 'hyperv.discovery.vmdetails[{$VM.ID}]'
          tags:
            - tag: component
              value: security
        - uuid: 5bd59090c2084b32ad5dd581f1e4172a
          name: 'VM name'
          type: DEPENDENT
          key: hyperv.vm.name
          delay: '0'
          value_type: CHAR
          trends: '0'
          description: 'Name of the VM as configured on the Hyper-V host.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.vm_info["{#VM.NAME}"]'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: 'hyperv.discovery.vmdetails[{$VM.ID}]'
          tags:
            - tag: component
              value: config
        - uuid: 0472e6a7f2794e77ac5404744d600902
          name: 'VM state'
          type: DEPENDENT
          key: hyperv.vm.state
          delay: '0'
          value_type: CHAR
          trends: '0'
          description: 'Run state of the VM: Running, Off, Paused, Saved, ...'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.vm_info["{#VM.STATE}"]'
          master_item:
            key: 'hyperv.discovery.vmdetails[{$VM.ID}]'
          tags:
            - tag: component
              value: state
          triggers:
            - uuid: 121f3d8ab4ba45a6827100fde8be70de
              expression: 'last(/Template Windows Hyper-V VM Guest 2/hyperv.vm.state)<>"Running"'
              name: 'Hyper-V: VM is not running on {HOST.NAME}'
              priority: INFO
              description: |
                The VM is not in the Running state. Informational by design, since a VM
                may legitimately be switched off. Disable this trigger on templates or
                hosts where it is only noise.
        - uuid: 696a0aefe73c42e69ce365c99a682baa
          name: 'VM state (numeric)'
          type: DEPENDENT
          key: hyperv.vm.state.value
          delay: '0'
          value_type: UNSIGNED
          description: 'Run state as the numeric Hyper-V VMState enum value, for graphing.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.vm_info["{#VM.STATE.VALUE}"]'
          master_item:
            key: 'hyperv.discovery.vmdetails[{$VM.ID}]'
          tags:
            - tag: component
              value: state
        - uuid: f1924b0c64534d8093d02712a4497ec3
          name: 'VM status'
          type: DEPENDENT
          key: hyperv.vm.status
          delay: '0'
          value_type: CHAR
          trends: '0'
          description: |
            Health status of the VM, normalized to english regardless of the host
            language (see ConvertToEnglish in hyper-v-monitoring2.ps1).
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.vm_info["{#VM.STATUS.TRANSLATED}"]'
          master_item:
            key: 'hyperv.discovery.vmdetails[{$VM.ID}]'
          tags:
            - tag: component
              value: state
          triggers:
            - uuid: 060ec7d23b3d4990b0f2df73d452b71d
              expression: 'last(/Template Windows Hyper-V VM Guest 2/hyperv.vm.status)<>"Operating normally" and last(/Template Windows Hyper-V VM Guest 2/hyperv.vm.status)<>""'
              name: 'Hyper-V: VM status is not normal on {HOST.NAME}'
              priority: WARNING
