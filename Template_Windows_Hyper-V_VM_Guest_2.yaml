                - '$.vm_info["{#VM.VERSION}"]'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: 'hyperv.discovery.vmdetails[{$VM.ID}]'
          tags:
            - tag: component
              value: config
        - uuid: 4aa656a8e026430ea1ab8c6748e721cc
