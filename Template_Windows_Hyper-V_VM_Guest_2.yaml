      tags:
        - tag: class
          value: software
        - tag: target
          value: hyper-v
        - tag: target
          value: hyper-v-vm
      macros:
        - macro: '{$VM.DETAILS.INTERVAL}'
          value: 10m
          description: |
            How often the Hyper-V host is asked for this VM's details.

            RAISE THIS IF THE HOST CPU SUFFERS. Every poll starts a
            powershell.exe, imports the Hyper-V module and walks the VM config
            including Get-VHD on every disk, and it runs once per VM per
            interval. On a host with 20 VMs the 10m default is one such run
            every 30 seconds; 30m or 60m makes that far less frequent.

            The payload is configuration, inventory and checkpoint data, none of
            which changes by the second, so a longer interval costs little
            besides slower VM state detection.
        - macro: '{$VM.CHECKPOINT.COUNT.MAX}'
          value: '3'
          description: |
            Warn above this many checkpoints on a single VM.
            Hyper-V Replica recovery points do not count towards this.
        - macro: '{$VM.CHECKPOINT.AGE.MAX}'
          value: '7d'
          description: |
            Warn when the oldest checkpoint of a VM is older than this.
            Hyper-V Replica recovery points are ignored.
        - macro: '{$VM.MEMORY.PRESSURE.MAX}'
          value: '90'
          description: |
            Warn when memory demand reaches this percentage of the memory assigned to
            the VM. A VM parked near its dynamic memory maximum sits here permanently,
            which is the point: it cannot grow any further.
        - macro: '{$VM.REPLICATION.MISSED.MAX}'
          value: '3'
          description: |
            Warn above this many missed replication cycles in Hyper-V's current
            measuring window. The occasional miss is normal on a busy host.
        - macro: '{$VM.REPLICATION.ERRORS.MAX}'
          value: '5'
          description: |
            Warn above this many replication errors in Hyper-V's current measuring
            window. Deliberately not 0: healthy VMs do log the odd error.
        - macro: '{$VM.REPLICATION.LAG.MAX}'
          value: 1h
          description: |
            Warn when a replicated VM has not completed a replication for this long.

            Must stay well above {$VM.DETAILS.INTERVAL}: the age is only refreshed when
            the master item runs, so it is already up to one interval old when Zabbix
            sees it. The default 1h suits every replication frequency Hyper-V offers
            (30s, 5m, 15m); lower it only together with {$VM.DETAILS.INTERVAL}.
